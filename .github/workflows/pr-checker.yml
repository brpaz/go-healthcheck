name: PR Check
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-pr-title:
    name: Check PR title
    runs-on: ubuntu-latest
    steps:
      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@639145d78959c53c43112365837e3abd21ed67c1 # 1.5.2
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          add_label: "false"

  validate-pr-labels:
    name: Check PR Labels
    runs-on: ubuntu-latest
    steps:
      - uses: docker://agilepathway/pull-request-label-checker:v1.6.98@sha256:e4a7244ec9455d91ae3e00a27ad23a0d1cf2674d98eae2d2ee150eab3c12b19e
        with:
          one_of: "breaking,feature,enhancement,bug,docs,dependencies,security,ci,maintenance,chore"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
